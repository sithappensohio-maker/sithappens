name: Apply Board Train Quick Check-In UI fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/board-train-quick-checkin-ui-v2'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sit_happens_test_disposable
      JWT_SECRET: github-actions-board-train-ui-test-secret
      APP_PUBLIC_URL: http://localhost:3000
      ADMIN_PASSWORD: github-actions-test-admin-password
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .automation/board-train-ui-v2.patch.gz.b64 ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Patch already consumed; nothing to do."
            exit 0
          fi
          echo "apply=true" >> "$GITHUB_OUTPUT"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "9281305a9097bd7a96c451ea31fb481b038ef2e9"
          base64 -d .automation/board-train-ui-v2.patch.gz.b64 | gunzip > /tmp/board-train-ui-v2.patch
          git apply --check /tmp/board-train-ui-v2.patch
          git apply /tmp/board-train-ui-v2.patch
          rm .automation/board-train-ui-v2.patch.gz.b64
          rm -f .automation/retrigger-v2
          git diff --check

      - name: Set up Python
        if: steps.patch.outputs.apply == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: steps.patch.outputs.apply == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Run Board Train backend regressions
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/board_train_scheduling.py backend/test_board_train_scheduling.py
          cd backend
          python -m pytest -q test_board_train_scheduling.py test_quick_checkin_client_pricing.py

      - name: Set up Node
        if: steps.patch.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: steps.patch.outputs.apply == 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Board Train frontend regressions
        if: steps.patch.outputs.apply == 'true'
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand boardTrainScheduling.test.js quickCheckInPricing.test.js

      - name: Build frontend
        if: steps.patch.outputs.apply == 'true'
        working-directory: frontend
        run: npm run build

      - name: Commit tested fix to PR branch
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sithappensohio-maker"
          git config user.email "sithappensohio@gmail.com"
          git add frontend/src/components/AdminBookingModal.jsx \
                  frontend/src/components/boardTrainScheduling.test.js \
                  backend/test_board_train_scheduling.py \
                  .automation/board-train-ui-v2.patch.gz.b64 \
                  .automation/retrigger-v2
          printf '%s\n' \
            .automation/board-train-ui-v2.patch.gz.b64 \
            .automation/retrigger-v2 \
            backend/test_board_train_scheduling.py \
            frontend/src/components/AdminBookingModal.jsx \
            frontend/src/components/boardTrainScheduling.test.js \
            | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check
          git commit -m "fix(front-desk): show Board Train as residential stay"
          git push origin HEAD:${{ github.head_ref }}
