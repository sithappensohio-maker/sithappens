name: Stage active client price fix

on:
  push:
    branches:
      - fix/active-client-price-history-direct
    paths:
      - .github/workflows/stage-active-client-price-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply verified two-file pricing fix
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=f572d447d2ecda4dfc93c41f7e117a74fa013d5a
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Refusing to apply: workflow commit parent is $actual_parent, expected $expected_parent" >&2
            exit 1
          fi

          cat > /tmp/active-client-price-fix.patch <<'PATCH'
          --- sithappens_orig_compare/sithappens-main/backend/server.py	2026-08-22 17:10:52.000000000 +0000
          +++ sithappens_fix/sithappens-main/backend/server.py	2026-08-23 10:16:27.395479494 +0000
          @@ -48100,6 +48100,41 @@
               return "Active"
 
 
          +def _price_override_precedence_key(row: dict) -> tuple:
          +    """Deterministic winner key for rows sharing one client/item key.
          +
          +    Revoked rows are filtered by the caller.  Explicit ``status=active`` rows
          +    outrank legacy rows whose status field predates the lifecycle feature;
          +    within the same lifecycle state, the newest edit/create wins.  The final
          +    id tie-breaker makes the result stable even for old rows missing timestamps.
          +    """
          +    row = row or {}
          +    return (
          +        1 if row.get("status") == "active" else 0,
          +        str(row.get("updated_at") or ""),
          +        str(row.get("created_at") or ""),
          +        str(row.get("id") or ""),
          +    )
          +
          +
          +def _pick_applicable_price_override(
          +    rows: List[Dict[str, Any]],
          +    today: Optional[date] = None,
          +) -> Optional[Dict[str, Any]]:
          +    """Pick the currently applicable override from retained price history.
          +
          +    ``price_overrides`` intentionally keeps revoked rows for audit/history.
          +    MongoDB natural order is therefore not a lifecycle rule: an unrestricted
          +    ``find_one`` can return an older revoked row before the newer active row and
          +    incorrectly make the canonical resolver fall back to standard pricing.
          +    Examine all rows for the exact key, keep only rows active *today*, and then
          +    choose deterministically.
          +    """
          +    applicable = [row for row in (rows or []) if _override_is_active(row, today)]
          +    if not applicable:
          +        return None
          +    return max(applicable, key=_price_override_precedence_key)
          +
 
           async def _apply_client_overrides(
               items: List[Dict[str, Any]],
          @@ -48176,11 +48211,17 @@
               }
               if not client_id or not target_code:
                   return out
          -    row = await db.price_overrides.find_one(
          +    # A key can legitimately have retained revoked history plus one newer
          +    # active row. Never let MongoDB natural order decide which lifecycle row
          +    # wins: inspect the exact-key history and choose the currently applicable
          +    # row deterministically. This is the canonical path used by Quick Check-In,
          +    # booking creation, checkout refresh, packs, and the client-price APIs.
          +    override_rows = await db.price_overrides.find(
                   {"client_id": client_id, "target_kind": target_kind, "target_code": target_code},
                   {"_id": 0},
          -    )
          -    if row and _override_is_active(row):
          +    ).to_list(500)
          +    row = _pick_applicable_price_override(override_rows)
          +    if row:
                   out["effective_price"] = float(row.get("override_price") or 0)
                   out["override_id"] = row.get("id")
                   out["override_row"] = row
          @@ -48405,12 +48446,19 @@
               # and has no status at all), this remains the original upsert-in-place
               # behavior: editing an active override's price is just an edit, not a
               # new lifecycle.
          -    existing = await db.price_overrides.find_one(
          +    # Do not use an unrestricted find_one here either. Once a client has
          +    # returned an item to standard price, retained revoked history may be the
          +    # oldest/natural-order row even while a newer active row also exists.
          +    # Editing the price must update that live row, not try to insert a second
          +    # active row and trip the uniqueness index.
          +    existing_rows = await db.price_overrides.find(
                   {"client_id": client_id, "target_kind": body.target_kind, "target_code": body.target_code},
                   {"_id": 0},
          -    )
          +    ).to_list(500)
          +    non_revoked_rows = [r for r in existing_rows if r.get("status") != "revoked"]
          +    existing = max(non_revoked_rows, key=_price_override_precedence_key) if non_revoked_rows else None
               ts = now_iso()
          -    reuse_existing_row = bool(existing) and existing.get("status") != "revoked"
          +    reuse_existing_row = bool(existing)
               doc = {
                   "id": existing["id"] if reuse_existing_row else str(uuid.uuid4()),
                   "client_id": client_id,
          --- sithappens_orig_compare/sithappens-main/backend/test_quick_checkin_client_pricing.py	2026-08-22 17:10:52.000000000 +0000
          +++ sithappens_fix/sithappens-main/backend/test_quick_checkin_client_pricing.py	2026-08-23 10:14:34.551483448 +0000
          @@ -258,3 +258,118 @@
                           assert float(prices[svc_a["id"]]["effective_price"]) == 30.0
                           assert [sid for sid, p in prices.items()
                                   if p["pricing_source"] == "client_override"] == []
          +
          +
          +def test_recreated_override_after_revoke_wins_over_retained_history_everywhere():
          +    """Production regression: the admin screen can truthfully show a newer
          +    ACTIVE $25 service override while the canonical resolver still returns the
          +    $30 catalog rate if an older REVOKED row is encountered first by find_one.
          +
          +    Retained history is intentional; every live pricing path must choose the
          +    currently applicable row rather than MongoDB natural order.
          +    """
          +    with _client_and_dog() as (client, dog):
          +        with _service("Lifecycle Daycare", 30.0, is_default=True) as svc:
          +            admin = _admin_user()
          +            old = run(server.create_client_price_override(
          +                client["id"],
          +                server.PriceOverrideIn(
          +                    target_kind="service", target_code=svc["id"], override_price=20.0,
          +                ),
          +                admin,
          +            ))
          +            run(server.delete_price_override(
          +                old["id"], server.PriceOverrideRevokeIn(reason="regression setup"), admin,
          +            ))
          +            new = run(server.create_client_price_override(
          +                client["id"],
          +                server.PriceOverrideIn(
          +                    target_kind="service", target_code=svc["id"], override_price=25.0,
          +                ),
          +                admin,
          +            ))
          +
          +            history = run(server.db.price_overrides.find(
          +                {"client_id": client["id"], "target_kind": "service", "target_code": svc["id"]},
          +                {"_id": 0},
          +            ).to_list(20))
          +            assert len(history) == 2
          +            assert next(r for r in history if r["id"] == old["id"])["status"] == "revoked"
          +            assert next(r for r in history if r["id"] == new["id"])["status"] == "active"
          +
          +            canonical = run(server.resolve_client_price(
          +                client["id"], "service", svc["id"], 30.0,
          +            ))
          +            assert canonical["pricing_source"] == "client_override"
          +            assert canonical["override_id"] == new["id"]
          +            assert float(canonical["effective_price"]) == 25.0
          +
          +            prices = _prices(client["id"])
          +            assert prices[svc["id"]]["pricing_source"] == "client_override"
          +            assert prices[svc["id"]]["override_id"] == new["id"]
          +            assert float(prices[svc["id"]]["effective_price"]) == 25.0
          +
          +            quote = run(server.pricing_quote(server.PricingQuoteIn(
          +                service_type="daycare",
          +                service_id=svc["id"],
          +                dog_id=dog["id"],
          +                date=date.today().isoformat(),
          +            ), admin))
          +            assert float(quote["unit_price"]) == 25.0
          +            assert float(quote["list_unit_price"]) == 30.0
          +            assert quote["preferred_rate_applied"] is True
          +            assert quote["price_override_id"] == new["id"]
          +
          +            with _walkin(dog["id"], svc["id"]) as booking:
          +                assert float(booking["estimated_price"]) == 25.0
          +                assert booking["price_override_id"] == new["id"]
          +                _check_in(booking["id"], hours_ago=9)
          +                preview = run(server.checkout_group_preview(booking["id"], admin))
          +                assert float(preview["bookings"][0]["checkout_preview_total"]) == 25.0
          +
          +
          +def test_setting_price_again_edits_live_row_even_when_revoked_history_exists():
          +    """The write path had the same unrestricted-find_one trap: after revoke
          +    + recreate, setting the price again could inspect the old revoked row and
          +    try to insert another active override. It must edit the current live row.
          +    """
          +    with _client_and_dog() as (client, dog):
          +        with _service("Lifecycle Edit Daycare", 30.0) as svc:
          +            admin = _admin_user()
          +            old = run(server.create_client_price_override(
          +                client["id"],
          +                server.PriceOverrideIn(
          +                    target_kind="service", target_code=svc["id"], override_price=20.0,
          +                ),
          +                admin,
          +            ))
          +            run(server.delete_price_override(
          +                old["id"], server.PriceOverrideRevokeIn(reason="regression setup"), admin,
          +            ))
          +            live = run(server.create_client_price_override(
          +                client["id"],
          +                server.PriceOverrideIn(
          +                    target_kind="service", target_code=svc["id"], override_price=25.0,
          +                ),
          +                admin,
          +            ))
          +
          +            edited = run(server.create_client_price_override(
          +                client["id"],
          +                server.PriceOverrideIn(
          +                    target_kind="service", target_code=svc["id"], override_price=27.0,
          +                ),
          +                admin,
          +            ))
          +            assert edited["id"] == live["id"]
          +            assert float(edited["override_price"]) == 27.0
          +
          +            history = run(server.db.price_overrides.find(
          +                {"client_id": client["id"], "target_kind": "service", "target_code": svc["id"]},
          +                {"_id": 0},
          +            ).to_list(20))
          +            assert len(history) == 2
          +            active = [r for r in history if server._override_is_active(r)]
          +            assert len(active) == 1
          +            assert active[0]["id"] == live["id"]
          +            assert float(active[0]["override_price"]) == 27.0
          PATCH

          patch -p2 --forward --batch < /tmp/active-client-price-fix.patch
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected=$'backend/server.py\nbackend/test_quick_checkin_client_pricing.py'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          python -m py_compile backend/server.py backend/test_quick_checkin_client_pricing.py

          git config user.name "sithappensohio-maker"
          git config user.email "sithappensohio@gmail.com"
          git add backend/server.py backend/test_quick_checkin_client_pricing.py
          git rm .github/workflows/stage-active-client-price-fix.yml
          git commit -m "stage pricing active-override fix"
          git push origin HEAD:fix/active-client-price-history-direct
