name: CI

on:
  push:
    branches:
      - main
      - 'school-*'
      - ci-test-runner
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sit_happens_ci
      JWT_SECRET: ci-only-not-a-production-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      ADMIN_NAME: CI Admin
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      RESEND_API_KEY: ''
      SENDER_EMAIL: noreply@example.com
      ADMIN_NOTIFICATION_EMAIL: admin@example.com
      STRIPE_ONLINE_ENABLED: 'false'
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      REACT_APP_BACKEND_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build
