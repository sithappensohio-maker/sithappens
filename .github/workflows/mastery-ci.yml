name: Mastery 75 Integration CI

on:
  push:
    branches:
      - school-mastery-ci

jobs:
  backend:
    name: Backend mastery + full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: sit_happens_mastery_ci
      JWT_SECRET: ci-only-not-a-production-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      ADMIN_NAME: CI Admin
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      RESEND_API_KEY: ''
      SENDER_EMAIL: noreply@example.com
      ADMIN_NOTIFICATION_EMAIL: admin@example.com
      STRIPE_ONLINE_ENABLED: 'false'
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact current main base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply mastery patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mastery-patch/part-* > /tmp/mastery.patch.gz.b64
          base64 -d /tmp/mastery.patch.gz.b64 | gzip -d > /tmp/mastery.patch
          echo "616586a2433b518a0d1893802447b28342b87aeee0884d55b8d6484c7371a0f8  /tmp/mastery.patch" | sha256sum -c -
          git apply --check /tmp/mastery.patch
          git apply /tmp/mastery.patch
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend

      - name: Run mastery regression set
        working-directory: backend
        run: >-
          pytest -q
          test_mastery_rules.py
          test_school_guided_lesson.py
          test_training_session_completion.py
          test_homework_personalization_phase5.py
          test_school_unified_delivery.py
          test_online_school_checkpoints.py
          test_online_school_hardening.py
          test_trainer_lesson_workspace.py

      - name: Run full backend suite
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend mastery + full Jest + build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      REACT_APP_BACKEND_URL: ''
    steps:
      - name: Checkout exact current main base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply mastery patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mastery-patch/part-* > /tmp/mastery.patch.gz.b64
          base64 -d /tmp/mastery.patch.gz.b64 | gzip -d > /tmp/mastery.patch
          echo "616586a2433b518a0d1893802447b28342b87aeee0884d55b8d6484c7371a0f8  /tmp/mastery.patch" | sha256sum -c -
          git apply --check /tmp/mastery.patch
          git apply /tmp/mastery.patch
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run mastery frontend regression set
        working-directory: frontend
        run: >-
          npm test -- --watchAll=false --runInBand
          src/lib/masteryProgression.test.js
          src/lib/practiceCoachPolish.test.js
          src/lib/onlineSchoolPolish.test.js
          src/components/lessonPracticeEntryPoints.test.js

      - name: Run full frontend suite
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
