# nginx config for the Sit Happens frontend container.
# - Serves the React SPA bundle from /usr/share/nginx/html
# - Proxies /api/* to the backend container on port 8001
# - Allows large uploads (vaccine certs, dog photos can be a few MB even after compression)
# - SPA fallback (history-mode routing): every non-asset request falls back to index.html

# Which requests get server-rendered HTML instead of the JavaScript shell.
#
# This exists because of one fact: nginx hands every non-asset request the
# same index.html, and React fills in <head> afterwards. Googlebot renders
# JavaScript and would eventually see those tags. Facebook, iMessage,
# WhatsApp, Slack, Discord and Twitter do NOT — they fetch once, read the
# bytes, and show whatever the shell carried. Without this map, every product
# link shared in a group chat previews as the generic site title with no
# picture, forever.
#
# It is not cloaking: the backend renders the same title, description, price
# and image the person sees, from the same public catalogue. Anything not
# matched here is untouched and gets the SPA exactly as before.
map $http_user_agent $sh_is_crawler {
    default                              0;
    "~*facebookexternalhit"              1;
    "~*Facebot"                          1;
    "~*Twitterbot"                       1;
    "~*Slackbot"                         1;
    "~*Discordbot"                       1;
    "~*WhatsApp"                         1;
    "~*TelegramBot"                      1;
    "~*LinkedInBot"                      1;
    "~*Pinterest"                        1;
    "~*redditbot"                        1;
    "~*SkypeUriPreview"                  1;
    "~*Applebot"                         1;
    "~*Googlebot"                        1;
    "~*bingbot"                          1;
    "~*DuckDuckBot"                      1;
    "~*Baiduspider"                       1;
    "~*YandexBot"                        1;
    "~*Embedly"                          1;
    "~*Iframely"                         1;
}

server {
    listen 80;
    server_name _;

    # Keep the normal app upload ceiling conservative. Full School curriculum
    # packages get their own unlimited route-specific allowance below because
    # the browser sends the ZIP as base64 inside JSON (about 33% larger than the
    # ZIP file on disk).
    client_max_body_size 25M;

    # Compress the React bundle and JSON responses on the local network.
    # Cloudflare may also compress public traffic, but LAN/PWA use should not
    # depend on Cloudflare being in the path.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    # Safe response headers. These do not change app behavior or stored data.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Full Curriculum ZIP imports can legitimately be much larger than normal
    # app uploads. Disable nginx's request-body size limit for this exact route
    # so future large courses are not blocked here. Other /api endpoints remain
    # at the 25M server default above.
    location = /api/admin/school/curriculum/import {
        client_max_body_size 0;
        proxy_pass         http://backend:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Long-cached Vite build assets (content-hashed filenames).
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache unhashed public images/fonts too. The HTML shell remains no-cache,
    # so deployments still pick up new bundles immediately.
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # robots.txt and sitemap.xml are generated from the live public catalogue
    # rather than shipped as static files, so a product hidden this morning is
    # out of the sitemap this afternoon — and can never be in it by being
    # forgotten in a file somebody edits by hand.
    location = /robots.txt {
        proxy_pass         http://backend:8001/api/public/shop/robots.txt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass         http://backend:8001/api/public/shop/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # A crawler or link-preview bot asking for a product page gets real HTML
    # with the real tags. A person gets the app, unchanged.
    location ~ ^/shop/item/(?<sh_kind>[^/]+)/(?<sh_item>[^/]+)/?$ {
        # Set at location level, not inside the `if`: proxy_set_header is not
        # allowed in an `if`, but headers set here still apply to the
        # proxy_pass that runs inside it.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        if ($sh_is_crawler) {
            proxy_pass http://backend:8001/api/public/shop/page-meta/$sh_kind/$sh_item;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /shop {
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        if ($sh_is_crawler) {
            proxy_pass http://backend:8001/api/public/shop/page-meta$is_args$args;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Everything else: SPA fallback so React Router works on refresh / deep links.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
