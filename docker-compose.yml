# Sit Happens — self-hosted stack.
# Two containers (frontend + backend) plus Mongo with a named volume for persistence.
# Cloudflare Tunnel runs on the HOST (not in compose) so a tunnel restart
# doesn't take the app down with it. See docs/operations/BAZZITE_SETUP.md.

services:
  mongo:
    image: mongo:7
    container_name: sit-happens-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db          # named volume — survives container rebuilds
      - ./backups:/backups            # bind mount so mongodump output lands on the host
    # Bind to localhost only — never expose Mongo to your LAN, let alone the internet.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sit-happens-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Root .env is read by Docker Compose and forwarded into the backend.
      # Mongo data lives in the named volume below, so rebuilds do not wipe it.
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-sit_happens}"
      # Pass-through app secrets/config from root .env:
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      APP_GIT_SHA: "${APP_GIT_SHA:-unknown}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SENDER_EMAIL: "${SENDER_EMAIL:-}"
      ADMIN_NOTIFICATION_EMAIL: "${ADMIN_NOTIFICATION_EMAIL:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      # Separate key for authenticator secrets at rest — deliberately NOT
      # JWT_SECRET, so rotating JWT_SECRET cannot lock out two-factor users.
      # Empty falls back to the JWT-derived key (existing installs keep working).
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sithappens.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      ACCESS_TOKEN_EXPIRE_DAYS: "${ACCESS_TOKEN_EXPIRE_DAYS:-7}"
      BACKUP_ROOT: "/app/backups"
      SCHOOL_MEDIA_ROOT: "/app/school_media"
      # Stripe Online (hosted Checkout) — off unless explicitly turned on.
      # Leave STRIPE_ONLINE_ENABLED unset/false in .env until the secret key
      # and webhook secret below are both configured and verified.
      STRIPE_ONLINE_ENABLED: "${STRIPE_ONLINE_ENABLED:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      # Persistent host bind mount for in-app JSON backups and pre-restore snapshots.
      # NOTE: ./backups is deliberately UNLABELLED - it is shared with the mongo
      # service below (mongodump writes there too), and :Z would relabel it
      # private to one container and lock the other out. If it ever needs a
      # label on an SELinux host it must be the shared :z, never :Z.
      - ./backups:/app/backups
      # :Z = relabel this bind mount for THIS container, privately.
      #
      # Without it, an SELinux host (Fedora, and therefore Bazzite) denies the
      # container write access to a host directory, and School media uploads
      # fail with EACCES even though the directory looks world-readable and the
      # process is root - DAC allows it, MAC does not. Private :Z rather than
      # shared :z because the backend is the only service that mounts this
      # directory. The suffix is ignored on non-SELinux hosts, so the same file
      # stays correct on the Windows/macOS dev machines.
      - ./school_media:/app/school_media:Z

  email-worker:
    # Reuses the backend image/build — only the command differs. Runs ONLY
    # the durable email_outbox processor (backend/email_worker.py). The daily
    # jobs (birthdays/vaccines/homework/trainer-digest/P&L), booking archive,
    # trophy re-check, recurring auto-extend and nightly backup run inside the
    # backend via backend/scheduler.py (Mongo-leased, one worker at a time).
    # Exactly ONE instance — do not scale this service.
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sit-happens-email-worker
    command: ["python", "email_worker.py"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-sit_happens}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SENDER_EMAIL: "${SENDER_EMAIL:-}"
      ADMIN_NOTIFICATION_EMAIL: "${ADMIN_NOTIFICATION_EMAIL:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      APP_GIT_SHA: "${APP_GIT_SHA:-unknown}"
      # Required only because email_service._is_in_quiet_hours() imports
      # server.py for get_settings(), and server.py reads JWT_SECRET at
      # module import time. Not otherwise used by this worker.
      JWT_SECRET: "${JWT_SECRET:-}"
    # No ports exposed — this service does not serve HTTP traffic.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Leave blank for single-origin: browser calls relative /api/* and nginx
        # routes those to the backend container. The legacy REACT_APP value is
        # still passed during the migration so existing .env files keep working.
        VITE_BACKEND_URL: "${VITE_BACKEND_URL:-}"
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-}"
        VITE_POS_AGENT_URL: "${VITE_POS_AGENT_URL:-}"
    container_name: sit-happens-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Bind to localhost only — Cloudflare Tunnel terminates on the host and
    # forwards to this port. Nothing on your LAN should hit nginx directly.
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mongo_data:
